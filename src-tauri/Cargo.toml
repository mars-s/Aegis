[package]
name = "aegis"
version = "0.3.2"
description = "A minimal infinite canvas where agents sort your brain dump"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Match Tauri 2.12 / wry 0.57 so the retained configuration has the same type.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSError"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKPreferences", "WKWebViewConfiguration"] }
objc2-avf-audio = "0.3.2"
objc2-speech = "0.3.2"
block2 = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
base64 = "0.21.7"
minisign = "0.10.0"
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
